<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>7-11 商品卡錢包</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        #barcode-canvas { width: 100%; max-width: 100%; height: auto; }
    </style>
</head>
<body class="bg-gradient-to-br from-orange-50 via-gray-50 to-orange-50 text-gray-800 min-h-screen pb-28">

    <!-- 頂部質感標題列 -->
    <header class="bg-gradient-to-r from-orange-600 via-orange-500 to-amber-500 text-white px-4 py-3.5 shadow-lg sticky top-0 z-30">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <h1 class="text-lg font-black tracking-wider flex items-center gap-2">
                <span class="bg-white text-orange-600 px-2 py-0.5 rounded-lg text-xs shadow-sm font-black tracking-tighter">7-ELEVEN</span> 
                <span id="header-title">商品卡列表</span>
            </h1>
            <span id="sync-badge" class="text-[11px] text-orange-50 flex items-center gap-1.5 font-medium bg-black/15 px-2.5 py-1 rounded-full">
                <span id="sync-dot" class="w-2 h-2 rounded-full bg-green-300 animate-pulse"></span>
                <span id="sync-text">同步中</span>
            </span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4 relative z-10">
        <!-- 分頁 1：商品卡列表頁 -->
        <div id="page-list" class="space-y-3.5">
            <div id="card-list" class="space-y-3.5">
                <div class="text-center py-16 text-gray-400 text-sm bg-white/80 rounded-3xl border border-gray-100 shadow-sm flex flex-col items-center justify-center gap-2">
                    <div class="w-6 h-6 border-2 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
                    正在連接資料庫...
                </div>
            </div>
        </div>

        <!-- 分頁 2：新增卡片頁 -->
        <div id="page-add" class="hidden space-y-4">
            <div class="bg-white rounded-3xl p-5 shadow-sm border border-orange-100 space-y-4">
                <div class="border-b border-gray-100 pb-3">
                    <h3 class="font-bold text-base text-gray-800 flex items-center gap-2"><span>✨</span> 新增商品卡</h3>
                    <p class="text-xs text-gray-400 mt-0.5">請掃描條碼或手動填寫資料</p>
                </div>

                <!-- 即時鏡頭掃描條碼區塊 -->
                <div class="bg-orange-50 border border-orange-100 p-3.5 rounded-2xl space-y-2.5">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="text-xs font-bold text-orange-800">📷 即時掃描條碼</p>
                            <p class="text-[11px] text-orange-600 mt-0.5">對準背面條碼即自動帶入</p>
                        </div>
                        <button type="button" id="scanner-btn" class="bg-orange-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow active:scale-95 transition cursor-pointer">
                            開啟鏡頭掃描
                        </button>
                    </div>
                    <div id="reader" class="hidden overflow-hidden rounded-xl border border-orange-200 bg-black"></div>
                </div>

                <form id="card-form" class="space-y-3.5">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">卡片名稱 (面額)</label>
                        <select id="input-name" class="w-full bg-gray-50 border border-gray-200 rounded-2xl py-3.5 px-3.5 text-sm focus:outline-none focus:border-orange-500 focus:bg-white transition cursor-pointer">
                            <option value="20元商品卡">20元商品卡</option>
                            <option value="25元商品卡">25元商品卡</option>
                            <option value="35元商品卡" selected>35元商品卡</option>
                            <option value="50元商品卡">50元商品卡</option>
                            <option value="100元商品卡">100元商品卡</option>
                            <option value="200元商品卡">200元商品卡</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">卡號 (背後一維條碼數字)</label>
                        <input type="text" id="input-number" inputmode="numeric" required placeholder="例如：7100016749202695" class="w-full bg-gray-50 border border-gray-200 rounded-2xl py-3.5 px-3.5 text-sm font-mono focus:outline-none focus:border-orange-500 focus:bg-white transition">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">原始面額 (NT$)</label>
                            <select id="input-initial" class="w-full bg-gray-50 border border-gray-200 rounded-2xl py-3.5 px-3.5 text-sm focus:outline-none focus:border-orange-500 focus:bg-white transition cursor-pointer">
                                <option value="20">20</option>
                                <option value="25">25</option>
                                <option value="35" selected>35</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                                <option value="200">200</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">目前剩餘金額 (NT$)</label>
                            <input type="number" id="input-balance" required value="35" class="w-full bg-gray-50 border border-gray-200 rounded-2xl py-3.5 px-3.5 text-sm focus:outline-none focus:border-orange-500 focus:bg-white transition">
                        </div>
                    </div>
                    <button type="submit" id="btn-submit-card" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-orange-500/30 active:scale-98 transition mt-2 cursor-pointer">
                        確認儲存卡片
                    </button>
                </form>
            </div>
        </div>

        <!-- 分頁 3：設定頁 -->
        <div id="page-settings" class="hidden space-y-4">
            <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 space-y-3">
                <h3 class="font-bold text-base text-gray-800">⚙️ 系統設定</h3>
                <p class="text-xs text-gray-500">目前資料庫連線正常，支援雙人即時同步。</p>
                <div class="bg-orange-50 p-4 rounded-2xl border border-orange-100 text-xs text-orange-800 space-y-1">
                    <p class="font-bold">💡 使用小提示：</p>
                    <p>• 點擊條碼可放大以供超商刷取。</p>
                    <p>• 結帳後可使用「快速扣款」隨時更新餘額。</p>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部固定導覽列 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-200/80 py-2.5 px-6 shadow-lg z-30">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <button type="button" onclick="switchTab('list')" id="nav-list" class="flex flex-col items-center gap-1 text-orange-600 cursor-pointer transition">
                <span class="text-xl">💳</span>
                <span class="text-[11px] font-bold">商品卡</span>
            </button>
            <button type="button" onclick="switchTab('add')" id="nav-add" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600 cursor-pointer transition">
                <span class="text-xl">➕</span>
                <span class="text-[11px] font-bold">新增卡片</span>
            </button>
            <button type="button" onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600 cursor-pointer transition">
                <span class="text-xl">⚙️</span>
                <span class="text-[11px] font-bold">設定</span>
            </button>
        </div>
    </nav>

    <!-- 結帳專用全螢幕高對比條碼 Modal -->
    <div id="barcode-modal" class="fixed inset-0 bg-black/95 hidden z-50 flex flex-col items-center justify-center p-3 sm:p-6">
        <div class="bg-white w-full max-w-md rounded-3xl p-5 sm:p-7 text-center space-y-5 relative shadow-2xl">
            <button type="button" id="btn-close-barcode" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center hover:bg-gray-200 font-bold text-base cursor-pointer">✕</button>
            
            <div class="pt-1">
                <span class="inline-block bg-orange-100 text-orange-700 text-[11px] font-bold px-2.5 py-0.5 rounded-full mb-1">結帳專用高對比模式</span>
                <h3 id="modal-card-name" class="font-black text-xl text-gray-900">統一商品卡</h3>
                <p id="modal-card-balance" class="text-orange-600 font-black text-lg mt-0.5"></p>
            </div>

            <div class="bg-white py-4 px-2 rounded-2xl border-2 border-gray-200 flex justify-center items-center overflow-hidden">
                <svg id="barcode-canvas"></svg>
            </div>

            <div class="bg-amber-50 border border-amber-300 p-3.5 rounded-2xl text-left flex items-start gap-2.5">
                <span class="text-xl leading-none">🔆</span>
                <div class="space-y-0.5">
                    <p class="text-xs font-black text-amber-900">請手動將手機螢幕亮度調至最高</p>
                    <p id="wakelock-status" class="text-[11px] text-amber-700">已啟用螢幕常亮保護，結帳時不會自動休眠</p>
                </div>
            </div>

            <button type="button" id="btn-close-barcode-bottom" class="w-full bg-gray-900 text-white font-bold py-3.5 rounded-2xl text-sm active:scale-98 transition cursor-pointer">
                結帳完成，關閉條碼
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ofsssxodiefoxwpwkxdk.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_emdUXSReiJ1R2H1idbmDEA_btdE-Y6d';

        let cardsData = [];
        let html5QrCode = null;
        let scannerIsRunning = false;
        let wakeLock = null;

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btn-close-barcode').addEventListener('click', closeBarcodeModal);
            document.getElementById('btn-close-barcode-bottom').addEventListener('click', closeBarcodeModal);
            document.getElementById('input-name').addEventListener('change', onCardTypeChange);
            document.getElementById('card-form').addEventListener('submit', saveCard);
            document.getElementById('scanner-btn').addEventListener('click', toggleScanner);

            document.addEventListener('visibilitychange', async () => {
                if (wakeLock !== null && document.visibilityState === 'visible') {
                    await requestWakeLock();
                }
            });

            fetchCards();
        });

        // 底部導覽列分頁切換邏輯
        function switchTab(tab) {
            const pageList = document.getElementById('page-list');
            const pageAdd = document.getElementById('page-add');
            const pageSettings = document.getElementById('page-settings');
            const headerTitle = document.getElementById('header-title');

            const navList = document.getElementById('nav-list');
            const navAdd = document.getElementById('nav-add');
            const navSettings = document.getElementById('nav-settings');

            // 預設全部隱藏、按鈕變灰
            pageList.classList.add('hidden');
            pageAdd.classList.add('hidden');
            pageSettings.classList.add('hidden');
            
            [navList, navAdd, navSettings].forEach(el => {
                el.className = "flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600 cursor-pointer transition";
            });

            if (tab === 'list') {
                pageList.classList.remove('hidden');
                headerTitle.innerText = '商品卡列表';
                navList.className = "flex flex-col items-center gap-1 text-orange-600 cursor-pointer transition";
                stopScanner();
            } else if (tab === 'add') {
                pageAdd.classList.remove('hidden');
                headerTitle.innerText = '新增商品卡';
                navAdd.className = "flex flex-col items-center gap-1 text-orange-600 cursor-pointer transition";
            } else if (tab === 'settings') {
                pageSettings.classList.remove('hidden');
                headerTitle.innerText = '系統設定';
                navSettings.className = "flex flex-col items-center gap-1 text-orange-600 cursor-pointer transition";
                stopScanner();
            }
        }

        function onCardTypeChange() {
            const nameSelect = document.getElementById('input-name').value;
            const match = nameSelect.match(/\d+/);
            if (match) {
                const val = match[0];
                document.getElementById('input-initial').value = val;
                document.getElementById('input-balance').value = val;
            }
        }

        async function requestWakeLock() {
            const statusEl = document.getElementById('wakelock-status');
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    statusEl.innerText = '已啟用螢幕常亮保護，結帳時不會自動休眠';
                } catch (err) {
                    statusEl.innerText = '瀏覽器省電模式限制，請留意螢幕休眠時間';
                }
            } else {
                statusEl.innerText = '此瀏覽器不支援自動常亮，請留意螢幕休眠';
            }
        }

        async function releaseWakeLock() {
            if (wakeLock !== null) {
                try {
                    await wakeLock.release();
                    wakeLock = null;
                } catch (err) {}
            }
        }

        async function showBarcode(cardNumber, cardName, balance) {
            document.getElementById('modal-card-name').innerText = cardName;
            document.getElementById('modal-card-balance').innerText = `剩餘金額：NT$ ${balance}`;
            document.getElementById('barcode-modal').classList.remove('hidden');

            await requestWakeLock();

            try {
                JsBarcode("#barcode-canvas", cardNumber, {
                    format: "CODE128",
                    lineColor: "#000000",
                    background: "#ffffff",
                    width: 2.8,
                    height: 120,
                    displayValue: true,
                    fontOptions: "bold",
                    fontSize: 16,
                    textMargin: 8,
                    margin: 20
                });
            } catch (e) {
                console.error('條碼繪製失敗:', e);
            }
        }

        async function closeBarcodeModal() {
            document.getElementById('barcode-modal').classList.add('hidden');
            await releaseWakeLock();
        }

        async function toggleScanner() {
            const readerDiv = document.getElementById('reader');
            const btn = document.getElementById('scanner-btn');

            if (scannerIsRunning) {
                await stopScanner();
                return;
            }

            readerDiv.classList.remove('hidden');
            btn.innerText = "關閉鏡頭";
            scannerIsRunning = true;

            try {
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("reader", {
                        formatsToSupport: [
                            Html5QrcodeSupportedFormats.CODE_128,
                            Html5QrcodeSupportedFormats.EAN_13,
                            Html5QrcodeSupportedFormats.EAN_8,
                            Html5QrcodeSupportedFormats.UPC_A,
                            Html5QrcodeSupportedFormats.UPC_E,
                            Html5QrcodeSupportedFormats.CODE_39,
                            Html5QrcodeSupportedFormats.ITF
                        ],
                        verbose: false
                    });
                }
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 15, qrbox: { width: 280, height: 120 } },
                    (decodedText) => {
                        document.getElementById('input-number').value = decodedText;
                        stopScanner();
                    },
                    (errorMessage) => {}
                );
            } catch (err) {
                console.error("無法開啟相機", err);
                alert("無法開啟相機，請檢查瀏覽器相機權限。");
                stopScanner();
            }
        }

        async function stopScanner() {
            if (html5QrCode && scannerIsRunning) {
                try {
                    await html5QrCode.stop();
                } catch (e) {}
                scannerIsRunning = false;
            }
            document.getElementById('reader').classList.add('hidden');
            document.getElementById('scanner-btn').innerText = "開啟鏡頭掃描";
        }

        async function fetchCards() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                let response;
                try {
                    response = await fetch(`${SUPABASE_URL}/rest/v1/seven_cards?select=*&order=created_at.desc`, {
                        headers: { 'apikey': SUPABASE_PUBLISHABLE_KEY },
                        signal: controller.signal
                    });
                } finally {
                    clearTimeout(timeoutId);
                }

                if (!response.ok) {
                    const body = await response.text();
                    let detail = body;
                    try {
                        const parsed = JSON.parse(body);
                        detail = parsed.message || parsed.details || parsed.hint || body;
                    } catch (_) {}
                    throw new Error(`HTTP ${response.status}: ${detail || '讀取失敗'}`);
                }

                cardsData = await response.json();
                renderCards();
                document.getElementById('sync-text').innerText = '同步中';
                document.getElementById('sync-dot').className = 'w-2 h-2 rounded-full bg-green-300 animate-pulse';
            } catch (err) {
                console.error('API 讀取失敗:', err);
                showError(err.name === 'AbortError' ? '連線逾時 (請檢查網路)' : err.message);
            }
        }

        function showError(msg) {
            document.getElementById('sync-text').innerText = '連線異常';
            document.getElementById('sync-dot').className = 'w-2 h-2 rounded-full bg-red-400';
            document.getElementById('card-list').innerHTML = `
                <div class="text-center py-10 text-red-500 text-sm bg-white rounded-3xl border border-red-100 shadow-sm space-y-2 p-4">
                    <p class="font-bold text-base">⚠️ 資料庫連線失敗</p>
                    <p class="text-xs text-gray-600 bg-red-50 p-2 rounded-lg font-mono">${msg}</p>
                    <button type="button" onclick="fetchCards()" class="mt-2 bg-orange-500 text-white text-xs font-bold px-4 py-2 rounded-xl cursor-pointer">重新連線</button>
                </div>`;
        }

        function renderCards() {
            const listEl = document.getElementById('card-list');

            if (cardsData.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-16 text-gray-400 text-sm bg-white/80 rounded-3xl border border-gray-100 shadow-sm space-y-2">
                        <div class="text-4xl">🏷️</div>
                        <p class="font-medium text-gray-600">目前沒有儲存的商品卡</p>
                        <p class="text-xs text-gray-400">點擊下方「新增卡片」開始建立吧！</p>
                    </div>`;
                return;
            }

            const sorted = [...cardsData].sort((a, b) => (b.balance > 0) - (a.balance > 0));

            listEl.innerHTML = '';
            sorted.forEach(card => {
                const isDepleted = Number(card.balance) <= 0;

                const cardEl = document.createElement('div');
                cardEl.className = `bg-white p-5 rounded-3xl shadow-sm border transition-all duration-200 ${isDepleted ? 'opacity-60 border-gray-200 bg-gray-50/50' : 'border-orange-100/80'}`;
                cardEl.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="font-bold text-gray-800 text-base">${card.name}</h3>
                                ${isDepleted ? '<span class="bg-gray-200 text-gray-600 text-[10px] font-bold px-2 py-0.5 rounded-full">已用完</span>' : '<span class="bg-orange-100 text-orange-700 text-[10px] font-bold px-2 py-0.5 rounded-full">可用</span>'}
                            </div>
                            <p class="text-xs font-mono text-gray-400 mt-0.5">卡號: ${card.card_number}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xl font-black ${isDepleted ? 'text-gray-400' : 'text-orange-600'}">NT$ ${card.balance}</span>
                            <span class="text-xs text-gray-400 block mt-0.5">原始面額 $${card.initial_amount}</span>
                        </div>
                    </div>
                    <div class="flex gap-2.5 pt-3 border-t border-gray-100/80">
                        <button type="button" onclick="showBarcode('${card.card_number}', '${card.name}', ${card.balance})" class="flex-1 bg-orange-50 text-orange-600 py-2.5 rounded-2xl text-xs font-bold active:scale-95 transition flex items-center justify-center gap-1 cursor-pointer">
                            <span>🖥️</span> 顯示條碼
                        </button>
                        <button type="button" onclick="promptDeduct('${card.id}', ${card.balance})" class="flex-1 bg-gray-100 text-gray-700 py-2.5 rounded-2xl text-xs font-bold active:scale-95 transition flex items-center justify-center gap-1 cursor-pointer">
                            <span>💳</span> 快速扣款
                        </button>
                        <button type="button" onclick="deleteCard('${card.id}')" class="w-10 bg-gray-50 text-gray-400 hover:text-red-500 rounded-2xl transition flex items-center justify-center text-xs cursor-pointer" title="刪除">
                            🗑️
                        </button>
                    </div>
                `;
                listEl.appendChild(cardEl);
            });
        }

        async function saveCard(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-card');
            btn.disabled = true;
            btn.innerText = '儲存中...';

            const name = document.getElementById('input-name').value;
            const card_number = document.getElementById('input-number').value.trim();
            const initial_amount = Number(document.getElementById('input-initial').value);
            const balance = Number(document.getElementById('input-balance').value);

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/seven_cards`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_PUBLISHABLE_KEY,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ name, card_number, initial_amount, balance })
                });

                if (!response.ok) {
                    const body = await response.text();
                    let detail = body;
                    try {
                        const parsed = JSON.parse(body);
                        detail = parsed.message || parsed.details || parsed.hint || body;
                    } catch (_) {}
                    throw new Error(`HTTP ${response.status}: ${detail || '寫入失敗'}`);
                }

                document.getElementById('card-form').reset();
                onCardTypeChange();
                fetchCards();
                switchTab('list'); // 儲存成功後自動切回列表頁
            } catch (err) {
                alert('儲存失敗：' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = '確認儲存卡片';
            }
        }

        async function promptDeduct(id, currentBalance) {
            const amountStr = prompt('請輸入本次消費扣款金額：');
            if (amountStr === null) return;
            const amount = Number(amountStr);
            if (isNaN(amount) || amount <= 0) {
                alert('請輸入有效的金額！');
                return;
            }

            const newBalance = Math.max(0, currentBalance - amount);
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/seven_cards?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_PUBLISHABLE_KEY,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ balance: newBalance })
                });

                if (!response.ok) throw new Error('扣款更新失敗');
                fetchCards();
            } catch (err) {
                alert(err.message);
            }
        }

        async function deleteCard(id) {
            if (!confirm('確定要刪除這張卡片的記錄嗎？')) return;
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/seven_cards?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: {
                        'apikey': SUPABASE_PUBLISHABLE_KEY,
                    }
                });

                if (!response.ok) throw new Error('刪除失敗');
                fetchCards();
            } catch (err) {
                alert(err.message);
            }
        }
    </script>
</body>
</html>
