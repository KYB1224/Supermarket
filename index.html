<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7-11 商品卡錢包</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JsBarcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <!-- html5-qrcode 用於手機鏡頭掃描條碼 -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-orange-50 via-gray-50 to-orange-50 text-gray-800 min-h-screen pb-24">

    <!-- 頂部質感標題列（單行精簡版） -->
    <header class="bg-gradient-to-r from-orange-600 via-orange-500 to-amber-500 text-white px-4 py-3.5 shadow-lg sticky top-0 z-30 backdrop-blur-md bg-opacity-95">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <h1 class="text-lg font-black tracking-wider flex items-center gap-2">
                <span class="bg-white text-orange-600 px-2 py-0.5 rounded-lg text-xs shadow-sm font-black tracking-tighter">7-ELEVEN</span> 
                <span>商品卡錢包</span>
            </h1>
            <span class="text-[11px] text-orange-50 flex items-center gap-1.5 font-medium bg-black/15 px-2.5 py-1 rounded-full">
                <span class="w-2 h-2 rounded-full bg-green-300 animate-pulse"></span>同步中
            </span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4 relative z-10">
        <!-- 總資產統計卡片 -->
        <div class="bg-gradient-to-r from-white to-orange-50/50 p-5 rounded-3xl shadow-md border border-orange-100 flex justify-between items-center relative overflow-hidden">
            <div class="absolute right-0 bottom-0 translate-x-4 translate-y-4 text-orange-100/50 text-7xl select-none pointer-events-none">💳</div>
            <div>
                <p class="text-xs font-bold text-gray-400 tracking-wider">共有資產總額</p>
                <p id="total-balance" class="text-3xl font-black text-orange-600 mt-0.5">NT$ 0</p>
            </div>
            <button type="button" onclick="openAddModal()" class="bg-gradient-to-r from-orange-500 to-amber-500 text-white text-sm font-bold px-5 py-3 rounded-2xl shadow-lg shadow-orange-500/30 active:scale-95 transition flex items-center gap-1.5 z-20 cursor-pointer">
                <span class="text-base font-black">＋</span> 新增卡片
            </button>
        </div>

        <!-- 卡片列表區 -->
        <div id="card-list" class="space-y-3.5">
            <div id="loading-state" class="text-center py-16 text-gray-400 text-sm bg-white/80 rounded-3xl border border-gray-100 shadow-sm flex flex-col items-center justify-center gap-2">
                <div class="w-6 h-6 border-2 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
                載入雲端卡片中...
            </div>
        </div>
    </main>

    <!-- 放大條碼 Modal -->
    <div id="barcode-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex flex-col items-center justify-center p-6 transition-all">
        <div class="bg-white w-full max-w-xs rounded-3xl p-6 text-center space-y-4 relative shadow-2xl">
            <button type="button" onclick="closeBarcodeModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center hover:bg-gray-200 font-bold transition">✕</button>
            <div class="pt-2">
                <h3 id="modal-card-name" class="font-bold text-lg text-gray-800">統一商品卡</h3>
                <p id="modal-card-balance" class="text-orange-600 font-bold text-sm mt-0.5"></p>
            </div>
            <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 flex justify-center shadow-inner">
                <svg id="barcode-canvas" class="max-w-full h-auto"></svg>
            </div>
            <p id="modal-card-number" class="font-mono text-gray-400 text-xs tracking-wider bg-gray-50 py-1.5 px-3 rounded-lg"></p>
            <p class="text-xs text-amber-700 bg-amber-50/80 border border-amber-200/60 p-2.5 rounded-xl font-medium">💡 結帳時請將螢幕亮度調到最高以利掃描</p>
        </div>
    </div>

    <!-- 新增卡片 Modal (支援相機掃描與下拉選單) -->
    <div id="add-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center sm:p-4 transition-all">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 class="font-bold text-lg text-gray-800 flex items-center gap-2"><span>✨</span> 新增商品卡</h3>
                <button type="button" onclick="closeAddModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center hover:bg-gray-200 font-bold transition">✕</button>
            </div>

            <!-- 相機掃描區塊 -->
            <div class="bg-orange-50 border border-orange-100 p-3 rounded-2xl space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-orange-700">📷 想要用相機掃描條碼？</span>
                    <button type="button" onclick="toggleScanner()" id="scanner-btn" class="bg-orange-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow hover:bg-orange-
