<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7-11 商品卡共用錢包</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JsBarcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts 提升字型質感 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-orange-50 via-gray-50 to-orange-50 text-gray-800 min-h-screen pb-24">

    <!-- 頂部質感標題列 -->
    <header class="bg-gradient-to-r from-orange-500 to-amber-500 text-white p-5 text-center shadow-lg sticky top-0 z-10 backdrop-blur-md bg-opacity-95">
        <h1 class="text-xl font-bold tracking-wide flex items-center justify-center gap-2">
            <span>🛒</span> 7-11 商品卡共用錢包
        </h1>
        <p class="text-xs text-orange-100 mt-1 flex items-center justify-center gap-1">
            <span class="w-2 h-2 rounded-full bg-green-300 animate-pulse"></span> 雙人即時同步中
        </p>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <!-- 總資產統計卡片 -->
        <div class="bg-gradient-to-r from-white to-orange-50/50 p-5 rounded-3xl shadow-md border border-orange-100 flex justify-between items-center relative overflow-hidden">
            <div class="absolute right-0 bottom-0 translate-x-4 translate-y-4 text-orange-100/50 text-7xl select-none pointer-events-none">💳</div>
            <div>
                <p class="text-xs font-medium text-gray-400 tracking-wider">共有資產總額</p>
                <p id="total-balance" class="text-3xl font-extrabold text-orange-600 mt-0.5">NT$ 0</p>
            </div>
            <button onclick="openAddModal()" class="bg-gradient-to-r from-orange-500 to-amber-500 text-white text-sm font-bold px-5 py-3 rounded-2xl shadow-lg shadow-orange-500/30 hover:shadow-orange-500/50 active:scale-95 transition flex items-center gap-1.5 z-10">
                <span class="text-base">＋</span> 新增卡片
            </button>
        </div>

        <!-- 卡片列表區 -->
        <div id="card-list" class="space-y-3.5">
            <!-- 載入中狀態 -->
            <div class="text-center py-16 text-gray-400 text-sm bg-white/80 rounded-3xl border border-gray-100 shadow-sm flex flex-col items-center justify-center gap-2">
                <div class="w-6 h-6 border-2 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
                載入雲端卡片中...
            </div>
        </div>
    </main>

    <!-- 放大條碼 Modal -->
    <div id="barcode-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex flex-col items-center justify-center p-6 transition-all">
        <div class="bg-white w-full max-w-xs rounded-3xl p-6 text-center space-y-4 relative shadow-2xl animate-in fade-in zoom-in-95 duration-200">
            <button onclick="closeBarcodeModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center hover:bg-gray-200 font-bold transition">✕</button>
            <div class="pt-2">
                <h3 id="modal-card-name" class="font-bold text-lg text-gray-800">統一商品卡</h3>
                <p id="modal-card-balance" class="text-orange-600 font-bold text-sm mt-0.5"></p>
            </div>
            <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 flex justify-center shadow-inner">
                <svg id="barcode-canvas" class="max-w-full h-auto"></svg>
            </div>
            <p id="modal-card-number" class="font-mono text-gray-400 text-xs tracking-wider bg-gray-50 py-1.5 px-3 rounded-lg"></p>
            <p class="text-xs text-amber-700 bg-amber-50/80 border border-amber-200/60 p-2.5 rounded-xl font-medium">💡 結帳時請將螢幕亮度調到最高以利掃描</p>
        </div>
    </div>

    <!-- 新增卡片 Modal -->
    <div id="add-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center sm:p-4 transition-all">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto animate-in slide-in-from-bottom duration-200">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 class="font-bold text-lg text-gray-800 flex items-center gap-2"><span>✨</span> 新增商品卡</h3>
                <button onclick="closeAddModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center hover:bg-gray-200 font-bold transition">✕</button>
            </div>
            <form id="card-form" onsubmit="saveCard(event)" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">卡片備註名稱</label>
                    <input type="text" id="input-name" required placeholder="例如：35元面額小卡 (老婆皮夾)" class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-3.5 text-sm focus:outline-none focus:border-orange-500 focus:bg-white transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">卡號 (背後一維條碼數字)</label>
                    <input type="text" id="input-number" required placeholder="例如：7100016749202695" class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-3.5 text-sm font-mono focus:outline-none focus:border-orange-500 focus:bg-white transition">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">原始面額 (NT$)</label>
                        <input type="number" id="input-initial" required placeholder="35" class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-3.5 text-sm focus:outline-none focus:border-orange-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">目前剩餘金額 (NT$)</label>
                        <input type="number" id="input-balance" required placeholder="35" class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-3.5 text-sm focus:outline-none focus:border-orange-500 focus:bg-white transition">
                    </div>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-orange-500/30 hover:shadow-orange-500/50 active:scale-98 transition mt-2">
                    確認儲存卡片
                </button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ofsssxodiefoxwpwkxdk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_emdXSRelJ1R2HlidbmDEA_btde-8wB5_7S5qjJmX1r6v9z0a';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let cardsData = [];

        async function init() {
            await fetchCards();
            
            supabaseClient
                .channel('public:seven_cards')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'seven_cards' }, payload => {
                    fetchCards();
                })
                .subscribe();
        }

        async function fetchCards() {
            const { data, error } = await supabaseClient
                .from('seven_cards')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('讀取失敗', error);
                return;
            }
            cardsData = data || [];
            renderCards();
        }

        function renderCards() {
            const listEl = document.getElementById('card-list');
            let total = 0;

            if (cardsData.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-16 text-gray-400 text-sm bg-white rounded-3xl border border-gray-100 shadow-sm space-y-2">
                        <div class="text-4xl">🏷️</div>
                        <p class="font-medium text-gray-600">目前沒有儲存的商品卡</p>
                        <p class="text-xs text-gray-400">點擊上方「+ 新增卡片」開始建立吧！</p>
                    </div>`;
                document.getElementById('total-balance').innerText = `NT$ 0`;
                return;
            }

            listEl.innerHTML = '';
            cardsData.forEach(card => {
                total += Number(card.balance);
                const isDepleted = card.balance <= 0;

                const cardEl = document.createElement('div');
                cardEl.className = `bg-white p-5 rounded-3xl shadow-sm border transition-all duration-200 ${isDepleted ? 'opacity-60 border-gray-200 bg-gray-50/50' : 'border-orange-100/80 hover:shadow-md hover:border-orange-300'}`;
                cardEl.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="font-bold text-gray-800 text-base">${card.name}</h3>
                                ${isDepleted ? '<span class="bg-gray-200 text-gray-600 text-[10px] font-bold px-2 py-0.5 rounded-full">已用完</span>' : '<span class="bg-orange-100 text-orange-700 text-[10px] font-bold px-2 py-0.5 rounded-full">可用</span>'}
                            </div>
                            <p class="text-xs font-mono text-gray-400 mt-0.5">卡號: ${card.card_number}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xl font-black ${isDepleted ? 'text-gray-400' : 'text-orange-600'}">NT$ ${card.balance}</span>
                            <span class="text-xs text-gray-400 block mt-0.5">原始面額 $${card.initial_amount}</span>
                        </div>
                    </div>
                    <div class="flex gap-2.5 pt-3 border-t border-gray-100/80">
                        <button onclick="showBarcode('${card.card_number}', '${card.name}', ${card.balance})" class="flex-1 bg-orange-50 text-orange-600 py-2.5 rounded-2xl text-xs font-bold hover:bg-orange-100 active:scale-95 transition flex items-center justify-center gap-1">
                            <span>🖥️</span> 顯示條碼
                        </button>
                        <button onclick="promptDeduct('${card.id}', ${card.balance})" class="flex-1 bg-gray-100 text-gray-700 py-2.5 rounded-2xl text-xs font-bold hover:bg-gray-200 active:scale-95 transition flex items-center justify-center gap-1">
                            <span>💳</span> 快速扣款
                        </button>
                        <button onclick="deleteCard('${card.id}')" class="w-10 bg-gray-50 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-2xl transition flex items-center justify-center text-xs" title="刪除">
                            🗑️
                        </button>
                    </div>
                `;
                listEl.appendChild(cardEl);
            });

            document.getElementById('total-balance').innerText = `NT$ ${total}`;
        }

        function showBarcode(cardNumber, cardName, balance) {
            document.getElementById('modal-card-name').innerText = cardName;
            document.getElementById('modal-card-balance').innerText = `剩餘金額：NT$ ${balance}`;
            document.getElementById('modal-card-number').innerText = cardNumber;
            document.getElementById('barcode-modal').classList.remove('hidden');

            try {
                JsBarcode("#barcode-canvas", cardNumber, {
                    format: "CODE128",
                    lineColor: "#111",
                    width: 2.2,
                    height: 85,
                    displayValue: true,
                    fontSize: 14,
                    margin: 5
                });
            } catch (e) {
                console.error(e);
            }
        }

        function closeBarcodeModal() {
            document.getElementById('barcode-modal').classList.add('hidden');
        }

        function openAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
        }
        function closeAddModal() {
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('card-form').reset();
        }

        async function saveCard(e) {
            e.preventDefault();
            const name = document.getElementById('input-name').value;
            const card_number = document.getElementById('input-number').value;
            const initial_amount = Number(document.getElementById('input-initial').value);
            const balance = Number(document.getElementById('input-balance').value);

            const { error } = await supabaseClient
                .from('seven_cards')
                .insert([{ name, card_number, initial_amount, balance }]);

            if (error) {
                alert('儲存失敗：' + error.message);
            } else {
                closeAddModal();
                fetchCards();
            }
        }

        async function promptDeduct(id, currentBalance) {
            const amountStr = prompt("請輸入本次消費扣款金額：");
            if (amountStr === null) return;
            const amount = Number(amount
